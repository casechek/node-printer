name: Prebuild Binaries

on:
  push:
    branches:
      - main
  pull_request:

# Add concurrency configuration to ensure only one workflow runs at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for the runtimes we ship binaries for.
# ELECTRON_TARGET must track the `electron` version in casechek/kiosk-electron's
# package.json -- prebuilds are keyed by ABI, so a mismatch silently sends the
# consumer back to compiling from source.
env:
  NODE_TARGET: '20.3.0'
  ELECTRON_TARGET: '35.7.5'

jobs:
  get-version:
    name: Get Package Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get package version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      - name: Set release version
        id: set-version
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "version=${{ steps.package-version.outputs.current-version }}-pr${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ steps.package-version.outputs.current-version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.set-version.outputs.version }}
          draft: true
          name: Release v${{ steps.set-version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prebuild-macos:
    name: Prebuild Binaries for macOS
    needs: get-version
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout
        uses: actions/checkout@v4

      # --ignore-scripts skips the package's own `prebuild-install || node-gyp rebuild`
      # install hook; the steps below do the real builds.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Extract certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLICATION_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLICATION_CERTIFICATE_P12_PASSWORD }}

      - name: Build and sign macOS prebuilds
        env:
          SIGN: codesign --sign "${{ vars.CERTIFICATE_IDENTITY }}" --timestamp --options runtime --force --verbose lib/node_printer.node
        run: |
          set -euo pipefail
          for arch in x64 arm64; do
            npx prebuild --backend node-gyp -r electron -t "$ELECTRON_TARGET" \
              --arch "$arch" --platform darwin --strip -c "$SIGN"
            npx prebuild --backend node-gyp -t "$NODE_TARGET" \
              --arch "$arch" --platform darwin --strip -c "$SIGN"
          done

          echo "Built archives:"
          find prebuilds -name '*.tar.gz' -type f

      - name: Upload macOS binaries to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          draft: true
          files: |
            *.tar.gz
            **/*.tar.gz
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prebuild-windows:
    name: Prebuild Binaries for Windows
    needs: get-version
    # Pinned to Visual Studio 2022 on purpose. `windows-latest` moved to VS 2026
    # (MSVC v145) in June 2026; this nan-based addon has never been compiled with that
    # toolset, and the binaries here ship to production kiosks. Keep the toolchain
    # stable and change it deliberately, not via a runner-image migration.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout
        uses: actions/checkout@v4

      # --ignore-scripts skips the package's own `prebuild-install || node-gyp rebuild`
      # install hook; the steps below do the real builds.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Windows prebuilds
        run: |
          npx prebuild --backend node-gyp -t $env:NODE_TARGET --arch x64 --platform win32 --strip
          npx prebuild --backend node-gyp -t $env:NODE_TARGET --arch ia32 --platform win32 --strip
          # Electron build for kiosk-electron: without this, @electron/rebuild falls back
          # to node-gyp on the consumer's runner.
          npx prebuild --backend node-gyp -r electron -t $env:ELECTRON_TARGET --arch x64 --platform win32 --strip

          Write-Host "Built archives:"
          Get-ChildItem -Path prebuilds -Recurse -Filter *.tar.gz | Select-Object -ExpandProperty FullName

      - name: Upload Windows binaries to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          draft: true
          files: |
            *.tar.gz
            **/*.tar.gz
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-prebuilds:
    name: Verify prebuild asset names
    needs: [get-version, prebuild-macos, prebuild-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Guards the failure mode that shipped in v1.1.0/v1.2.0: binaries were uploaded,
      # but under names prebuild-install never asks for, so every consumer silently
      # compiled from source instead.
      - name: Assert every expected archive was uploaded
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.get-version.outputs.version }}
        run: |
          node tools/verify-prebuilds.mjs "$RELEASE_TAG" \
            node:$NODE_TARGET:win32:x64 \
            node:$NODE_TARGET:win32:ia32 \
            node:$NODE_TARGET:darwin:x64 \
            node:$NODE_TARGET:darwin:arm64 \
            electron:$ELECTRON_TARGET:win32:x64 \
            electron:$ELECTRON_TARGET:darwin:x64 \
            electron:$ELECTRON_TARGET:darwin:arm64

  publish-release:
    name: Publish GitHub Release
    needs: [get-version, prebuild-macos, prebuild-windows, verify-prebuilds]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          draft: false
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
